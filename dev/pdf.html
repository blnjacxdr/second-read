<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Second Read: Nov 21 PDF reader (dev only)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1d1d1f; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin-top: 1.75rem; }
  .dev { background: #fff4ce; border: 1px solid #e0c46c; padding: .5rem .75rem; border-radius: 6px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: .6rem .9rem; margin: .6rem 0; }
  .card h3 { font-size: .95rem; margin: 0 0 .3rem; }
  dl { display: grid; grid-template-columns: minmax(7rem, 16rem) minmax(0, 1fr); gap: .25rem .9rem; margin: 0; }
  dt, dd { overflow-wrap: anywhere; }
  dt { color: #666; } dd { margin: 0; }
  .prose { white-space: pre-wrap; margin: .4rem 0; }
  .ok { color: #0a7d32; } .bad { color: #b00020; } .muted { color: #666; }
  .flag { border-left: 4px solid #c77700; }
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: .6rem; }
  .quote { margin: 0; background: #f5f5f7; border-radius: 6px; padding: .5rem .7rem; }
  .quote figcaption { font-size: .8rem; color: #666; margin-bottom: .2rem; }
  .quote blockquote { margin: 0; }
  details { margin-top: 1.5rem; } pre { background: #f5f5f7; padding: .75rem; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Second Read: PDF reader test</h1>
<p class="dev">Development page. Pick a Common App preview PDF (any college), or a fictional sample from <code>sample/</code>.
The file is read in this browser tab only; nothing is uploaded. Open DevTools &gt; Network to check.</p>

<input type="file" id="file" accept="application/pdf">
<p id="status" class="muted">No file yet.</p>
<div id="out"></div>

<script type="module" src="./pdf.js"></script>
</body>
</html>
