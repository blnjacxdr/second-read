<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Read: your Common App, read twice</title>
  <meta name="description" content="A private consistency checker for your Common App PDF. It runs on your own laptop, points at spots that disagree, and never writes a word for you.">
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;800;900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <style>
    /* Placeholder until the app ships (Nov 26). No scripts on this page. */
    body { margin: 0; min-height: 100vh; font-family: 'Gabarito', system-ui, sans-serif; color: var(--ink); background-color: var(--paper);
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--paper-rule) 31px, var(--paper-rule) 32px); }
    main { max-width: 760px; padding: 72px 32px 72px 104px; position: relative; }
    main::before { content: ""; position: fixed; top: 0; bottom: 0; left: 64px; width: 2px; background: var(--margin-line); }
    .logo { display: flex; gap: 10px; align-items: center; font-weight: 900; font-size: 24px; letter-spacing: -0.04em; }
    h1 { margin: 56px 0 20px; font-weight: 900; font-size: clamp(48px, 9vw, 92px); line-height: .92; letter-spacing: -0.05em; }
    p { margin: 0 0 14px; font-size: 20px; color: var(--ink-2); max-width: 560px; }
    .note { margin-top: 36px; font-family: 'Nanum Pen Script', cursive; font-size: 30px; color: #2340D9; transform: rotate(-2deg); display: inline-block; }
    @media (max-width: 720px) { main { padding: 48px 20px; } main::before { display: none; } }
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="assets/logo-mark.svg" width="46" height="22" alt="">second read</div>
    <h1>Your application, read twice.</h1>
    <p>Second Read goes through your Common App PDF on your own laptop and finds every spot where it disagrees with itself. It points. You fix. It never writes a word for you.</p>
    <p>Opening this week.</p>
    <span class="note">the second read happens on your laptop. not a server, not us.</span>
  </main>
</body>
</html>
